<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Calibrated drawing with measurement overlays</title>
  <desc id="description">A floor plan example with length, polyline, area, angle, and count measurements, plus several selected measurement objects.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#edf1f4" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#183247" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M0 0L8 4L0 8Z" fill="#14866d"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; }
      .wall { fill: none; stroke: #34495a; stroke-width: 8; stroke-linecap: square; stroke-linejoin: round; }
      .partition { fill: none; stroke: #718394; stroke-width: 4; stroke-linecap: square; }
      .measure { fill: none; stroke: #14866d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .measure-dash { fill: none; stroke: #14866d; stroke-width: 3; stroke-dasharray: 8 7; }
      .label { fill: #fff; stroke: #d7e3e8; stroke-width: 1.5; }
      .selected { fill: none; stroke: #2672d8; stroke-width: 2.5; stroke-dasharray: 8 6; }
    </style>
  </defs>
  <rect width="1200" height="760" rx="24" fill="#eef3f6"/>
  <rect x="34" y="28" width="1132" height="704" rx="16" fill="#fff" filter="url(#shadow)"/>
  <rect x="54" y="48" width="1092" height="664" rx="9" fill="url(#grid)"/>
  <text x="78" y="88" fill="#30485a" font-size="20" font-weight="700" letter-spacing="1.2">A-102  |  LEVEL 1 PLAN</text>
  <text x="78" y="116" fill="#718394" font-size="14" letter-spacing=".7">CALIBRATED DRAWING  •  MEASUREMENT OVERLAY</text>
  <line x1="78" y1="134" x2="1122" y2="134" stroke="#dbe4e9" stroke-width="2"/>

  <!-- Architectural plan -->
  <path class="wall" d="M132 190H1018V606H132Z"/>
  <path class="partition" d="M132 355H1018M398 190V355M675 190V606M398 355V606M847 355V606"/>
  <path class="partition" d="M132 480H398M847 480H1018"/>
  <path d="M270 190V245M270 300V355M545 190V245M545 300V355M675 430H735M790 430H847M398 500V548M455 606V548M900 480V535M955 606V535" fill="none" stroke="#fff" stroke-width="12"/>
  <path d="M270 245A55 55 0 0 1 325 300M545 245A55 55 0 0 1 600 300M735 430A55 55 0 0 1 790 485M398 548A57 57 0 0 1 455 491M900 535A55 55 0 0 1 955 480" fill="none" stroke="#8395a3" stroke-width="2.5"/>
  <text x="185" y="285" fill="#91a0aa" font-size="17" letter-spacing="1">ROOM 101</text>
  <text x="435" y="285" fill="#91a0aa" font-size="17" letter-spacing="1">ROOM 102</text>
  <text x="730" y="285" fill="#91a0aa" font-size="17" letter-spacing="1">ROOM 103</text>
  <text x="190" y="548" fill="#91a0aa" font-size="17" letter-spacing="1">ROOM 104</text>
  <text x="492" y="548" fill="#91a0aa" font-size="17" letter-spacing="1">ROOM 105</text>
  <text x="879" y="548" fill="#91a0aa" font-size="17" letter-spacing="1">ROOM 106</text>

  <!-- Length -->
  <line x1="168" y1="632" x2="720" y2="632" class="measure" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="168" y1="612" x2="168" y2="646" class="measure"/>
  <line x1="720" y1="612" x2="720" y2="646" class="measure"/>
  <rect class="label" x="347" y="610" width="194" height="42" rx="8"/>
  <text x="444" y="638" text-anchor="middle" fill="#126c58" font-size="20" font-weight="700">4,558 mm</text>
  <rect class="selected" x="332" y="599" width="224" height="64" rx="9"/>
  <rect x="328" y="595" width="8" height="8" rx="1" fill="#2672d8"/>
  <rect x="552" y="595" width="8" height="8" rx="1" fill="#2672d8"/>
  <rect x="328" y="659" width="8" height="8" rx="1" fill="#2672d8"/>
  <rect x="552" y="659" width="8" height="8" rx="1" fill="#2672d8"/>

  <!-- Polyline -->
  <path d="M175 324L246 288L312 316L373 270" class="measure"/>
  <circle cx="175" cy="324" r="5" fill="#14866d"/>
  <circle cx="246" cy="288" r="5" fill="#14866d"/>
  <circle cx="312" cy="316" r="5" fill="#14866d"/>
  <circle cx="373" cy="270" r="5" fill="#14866d"/>
  <rect class="label" x="145" y="225" width="164" height="38" rx="8"/>
  <text x="227" y="250" text-anchor="middle" fill="#126c58" font-size="17" font-weight="700">12.4 m polyline</text>
  <rect class="selected" x="135" y="215" width="251" height="124" rx="10"/>

  <!-- Area -->
  <path d="M715 374L745 331L815 326L835 369L800 410L731 414Z" fill="#35a884" fill-opacity=".12" stroke="#14866d" stroke-width="3"/>
  <rect class="label" x="685" y="346" width="215" height="46" rx="8"/>
  <text x="792" y="375" text-anchor="middle" fill="#126c58" font-size="15" font-weight="700">2,149,591.84 mm²</text>
  <rect class="selected" x="676" y="315" width="233" height="110" rx="10"/>

  <!-- Angle -->
  <path d="M490 438L429 390M490 438L572 409" class="measure"/>
  <path d="M461 415A36 36 0 0 1 524 426" class="measure-dash"/>
  <circle cx="490" cy="438" r="5" fill="#14866d"/>
  <rect class="label" x="450" y="448" width="103" height="38" rx="8"/>
  <text x="501" y="473" text-anchor="middle" fill="#126c58" font-size="18" font-weight="700">158.7°</text>
  <rect class="selected" x="417" y="378" width="168" height="121" rx="10"/>

  <!-- Count -->
  <g font-size="15" font-weight="700" text-anchor="middle">
    <circle cx="184" cy="410" r="18" fill="#14866d"/><text x="184" y="415" fill="#fff">1</text>
    <circle cx="234" cy="410" r="18" fill="#14866d"/><text x="234" y="415" fill="#fff">2</text>
    <circle cx="284" cy="410" r="18" fill="#14866d"/><text x="284" y="415" fill="#fff">3</text>
  </g>
  <rect class="label" x="150" y="438" width="170" height="34" rx="8"/>
  <text x="235" y="460" text-anchor="middle" fill="#126c58" font-size="15" font-weight="700">3 door openings</text>

  <!-- Calibration reference -->
  <line x1="865" y1="236" x2="1005" y2="236" stroke="#526778" stroke-width="3"/>
  <line x1="865" y1="227" x2="865" y2="245" stroke="#526778" stroke-width="3"/>
  <line x1="1005" y1="227" x2="1005" y2="245" stroke="#526778" stroke-width="3"/>
  <text x="935" y="219" text-anchor="middle" fill="#526778" font-size="16" font-weight="700">1,000 mm reference</text>

  <rect x="846" y="147" width="171" height="34" rx="17" fill="#eaf2ff" stroke="#b9d1f5"/>
  <circle cx="865" cy="164" r="5" fill="#2672d8"/>
  <text x="879" y="169" fill="#245b9d" font-size="14" font-weight="600">4 measurements selected</text>
  <text x="78" y="687" fill="#7b8b97" font-size="13">Window-select multiple measurements to move them together.</text>
</svg>
