<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>ThryvoPDF Markup Studio</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F3A"/>
      <stop offset="1" stop-color="#0C4A56"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- plan sheet with folded corner -->
  <path d="M104 64H348L416 132V448H104Z" fill="#F4F8FB"/>
  <path d="M348 64V132H416Z" fill="#B7CAD6"/>
  <!-- dimension line with ticks -->
  <g stroke="#0C4A56" stroke-width="12" stroke-linecap="round">
    <path d="M144 116H300"/>
    <path d="M144 98V134M300 98V134"/>
  </g>
  <!-- floor plan walls; the T junction is a quiet nod to the T of Thryvo -->
