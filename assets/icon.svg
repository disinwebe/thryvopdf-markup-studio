    <path d="M148 186H372V402H148Z"/>
    <path d="M148 294H260M260 186V294"/>
  </g>
  <!-- door swing -->
  <path d="M296 402V346A56 56 0 0 1 352 402Z" fill="#2DD4BF" fill-opacity="0.35" stroke="#0C4A56" stroke-width="8"/>
  <!-- redline revision cloud -->
  <path d="M268 214 A20 20 0 0 1 308 214 A20 20 0 0 1 348 214 A20 20 0 0 1 388 214 A20 20 0 0 1 388 254 A20 20 0 0 1 388 294 A20 20 0 0 1 348 294 A20 20 0 0 1 308 294 A20 20 0 0 1 268 294 A20 20 0 0 1 268 254 A20 20 0 0 1 268 214Z" fill="none" stroke="#E11D48" stroke-width="12" stroke-linejoin="round"/>
</svg>
